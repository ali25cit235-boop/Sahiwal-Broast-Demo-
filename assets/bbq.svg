<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="bbqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3D00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="charSkewer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#4E0D00"/>
    </linearGradient>
    <filter id="bbqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="150" cy="120" r="105" fill="url(#bbqGlow)"/>
  <ellipse cx="150" cy="210" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#bbqShadow)">
    <!-- Charcoal Grill Grate -->
    <ellipse cx="150" cy="140" rx="100" ry="40" fill="#212121" stroke="#424242" stroke-width="2"/>
    <line x1="60" y1="140" x2="240" y2="140" stroke="#616161" stroke-width="1.5"/>
    <line x1="80" y1="125" x2="220" y2="125" stroke="#616161" stroke-width="1.5"/>
    <line x1="80" y1="155" x2="220" y2="155" stroke="#616161" stroke-width="1.5"/>

    <!-- Glowing Hot Embers beneath -->
    <ellipse cx="130" cy="142" rx="14" ry="5" fill="#FF5722" opacity="0.8"/>
    <ellipse cx="170" cy="138" rx="12" ry="4" fill="#FFAB00" opacity="0.9"/>
    <ellipse cx="150" cy="150" rx="15" ry="5" fill="#E65100" opacity="0.7"/>

    <!-- Skewer 1: Malai Boti (Golden Creamy) -->
    <g transform="translate(0, -10)">
      <line x1="45" y1="105" x2="255" y2="105" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round"/>
      <!-- Boti chunks -->
      <rect x="75" y="94" width="28" height="22" rx="8" fill="#FFE082" stroke="#FFB300" stroke-width="1.5"/>
      <rect x="110" y="93" width="30" height="24" rx="8" fill="#FFF8E1" stroke="#FFA000" stroke-width="1.5"/>
      <rect x="148" y="94" width="29" height="22" rx="8" fill="#FFE082" stroke="#FFB300" stroke-width="1.5"/>
      <rect x="185" y="93" width="28" height="24" rx="8" fill="#FFF8E1" stroke="#FFA000" stroke-width="1.5"/>
      <!-- Char marks -->
      <line x1="82" y1="98" x2="96" y2="104" stroke="#4E342E" stroke-width="2"/>
      <line x1="118" y1="96" x2="132" y2="102" stroke="#4E342E" stroke-width="2"/>
      <line x1="155" y1="98" x2="170" y2="104" stroke="#4E342E" stroke-width="2"/>
      <line x1="192" y1="96" x2="206" y2="102" stroke="#4E342E" stroke-width="2"/>
    </g>

    <!-- Skewer 2: Chicken Seekh Kabab (Center) -->
    <g transform="translate(0, 18)">
      <line x1="40" y1="115" x2="260" y2="115" stroke="#90A4AE" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Minced Kabab log with ribbed pattern -->
      <rect x="68" y="103" width="164" height="24" rx="10" fill="url(#charSkewer)"/>
      <!-- Kabab indentation segments -->
      <ellipse cx="90" cy="115" rx="3" ry="9" fill="#3E2723"/>
      <ellipse cx="115" cy="115" rx="3" ry="9" fill="#3E2723"/>
      <ellipse cx="140" cy="115" rx="3" ry="9" fill="#3E2723"/>
      <ellipse cx="165" cy="115" rx="3" ry="9" fill="#3E2723"/>
      <ellipse cx="190" cy="115" rx="3" ry="9" fill="#3E2723"/>
      <ellipse cx="215" cy="115" rx="3" ry="9" fill="#3E2723"/>
    </g>

    <!-- Skewer 3: Spicy Red Chicken Tikka Seekh -->
    <g transform="translate(0, 46)">
      <line x1="45" y1="125" x2="255" y2="125" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round"/>
      <rect x="78" y="114" width="29" height="22" rx="8" fill="#D50000"/>
      <rect x="114" y="113" width="31" height="24" rx="8" fill="#FF1744"/>
      <rect x="152" y="114" width="28" height="22" rx="8" fill="#C62828"/>
      <rect x="188" y="113" width="29" height="24" rx="8" fill="#D50000"/>
      <!-- Char marks -->
      <line x1="84" y1="118" x2="100" y2="124" stroke="#212121" stroke-width="2.5"/>
      <line x1="122" y1="116" x2="138" y2="122" stroke="#212121" stroke-width="2.5"/>
      <line x1="160" y1="118" x2="174" y2="124" stroke="#212121" stroke-width="2.5"/>
    </g>

    <!-- Fresh Lemon slice & mint garnish -->
    <circle cx="65" cy="170" r="14" fill="#FFEE58" stroke="#FDD835" stroke-width="2"/>
    <circle cx="65" cy="170" r="10" fill="#FFF59D"/>
    <line x1="65" y1="160" x2="65" y2="180" stroke="#FFF" stroke-width="1.2"/>
    <line x1="55" y1="170" x2="75" y2="170" stroke="#FFF" stroke-width="1.2"/>
    <ellipse cx="230" cy="170" rx="10" ry="5" fill="#43A047" transform="rotate(-20 230 170)"/>
  </g>
</svg>
