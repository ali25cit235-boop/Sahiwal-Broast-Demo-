<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="riceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="60%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#BDBDBD"/>
    </linearGradient>
    <filter id="riceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="120" r="105" fill="url(#riceGlow)"/>
  <ellipse cx="150" cy="210" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#riceShadow)">
    <!-- Oval Serving Platter -->
    <ellipse cx="150" cy="135" rx="110" ry="46" fill="url(#platterGrad)" stroke="#E0E0E0" stroke-width="2"/>
    <ellipse cx="150" cy="133" rx="100" ry="40" fill="#FFFFFF"/>

    <!-- Cucumber Slices Border Garnish -->
    <g fill="#4CAF50" stroke="#81C784" stroke-width="1.2">
      <ellipse cx="60" cy="130" rx="8" ry="4" transform="rotate(-30 60 130)"/>
      <ellipse cx="75" cy="155" rx="8" ry="4" transform="rotate(-15 75 155)"/>
      <ellipse cx="105" cy="168" rx="8" ry="4" transform="rotate(5 105 168)"/>
      <ellipse cx="150" cy="172" rx="8" ry="4"/>
      <ellipse cx="195" cy="168" rx="8" ry="4" transform="rotate(-5 195 168)"/>
      <ellipse cx="225" cy="155" rx="8" ry="4" transform="rotate(15 225 155)"/>
      <ellipse cx="240" cy="130" rx="8" ry="4" transform="rotate(30 240 130)"/>
      <ellipse cx="225" cy="110" rx="8" ry="4" transform="rotate(-15 225 110)"/>
      <ellipse cx="75" cy="110" rx="8" ry="4" transform="rotate(15 75 110)"/>
    </g>

    <!-- Fragrant Rice Mound (Basmati grains) -->
    <ellipse cx="150" cy="128" rx="84" ry="32" fill="#FFE082"/>
    <ellipse cx="150" cy="124" rx="72" ry="26" fill="#FFF8E1"/>

    <!-- Yellow saffron / Zarda coloring spots -->
    <path d="M110 115 Q130 110 145 120 Q125 130 110 115" fill="#FFB300" opacity="0.8"/>
    <path d="M165 118 Q185 112 195 125 Q175 132 165 118" fill="#FF8F00" opacity="0.85"/>
    <path d="M130 132 Q150 126 168 136 Q145 142 130 132" fill="#FFA000" opacity="0.8"/>

    <!-- Roasted Spiced Meat / Chicken Chunks -->
    <rect x="135" y="108" width="28" height="18" rx="8" fill="#8D6E63" transform="rotate(-10 149 117)"/>
    <rect x="160" y="120" width="24" height="16" rx="7" fill="#6D4C41" transform="rotate(15 172 128)"/>
    <rect x="108" y="122" width="22" height="15" rx="6" fill="#8D6E63" transform="rotate(20 119 129)"/>

    <!-- Golden Fried Onions (پیاز بیرستہ) -->
    <path d="M120 112 Q126 116 122 122" stroke="#5D4037" stroke-width="2" fill="none"/>
    <path d="M142 110 Q148 114 144 120" stroke="#4E342E" stroke-width="2" fill="none"/>
    <path d="M172 115 Q178 120 174 126" stroke="#5D4037" stroke-width="2" fill="none"/>
    <path d="M152 135 Q158 139 154 145" stroke="#4E342E" stroke-width="2" fill="none"/>

    <!-- Cucumber Carved Heart Centerpiece (as in actual restaurant photos) -->
    <g transform="translate(142, 118) scale(0.7)">
      <path d="M12 21 C12 21 0 13 0 6 C0 2 3 0 6 0 C9 0 12 3 12 3 C12 3 15 0 18 0 C21 0 24 2 24 6 C24 13 12 21 12 21 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
    </g>

    <!-- Red Cherries & Raisins (as decorated in Kamalia special pulao) -->
    <circle cx="132" cy="120" r="4" fill="#D50000"/>
    <circle cx="168" cy="122" r="4" fill="#D50000"/>
    <circle cx="150" cy="140" r="4" fill="#D50000"/>

    <!-- Boiled Egg Slices -->
    <ellipse cx="185" cy="132" rx="7" ry="5" fill="#FFFFFF"/>
    <circle cx="185" cy="132" r="3" fill="#FDD835"/>
  </g>
</svg>
