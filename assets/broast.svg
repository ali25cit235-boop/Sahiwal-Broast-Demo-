<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="broastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9E00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="broastCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="35%" stop-color="#E65100"/>
      <stop offset="70%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#671600"/>
    </linearGradient>
    <linearGradient id="broastHighlight" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="150" cy="120" r="105" fill="url(#broastGlow)" />

  <!-- Shadow Plate Ground -->
  <ellipse cx="145" cy="205" rx="100" ry="16" fill="#050304" opacity="0.6" />

  <!-- Steam particles -->
  <g class="steam-group" opacity="0.75" stroke="#FFE082" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M120 70 Q115 50 122 35 T118 15" stroke-dasharray="3 3"/>
    <path d="M155 65 Q160 45 152 30 T158 10" stroke-dasharray="4 2"/>
    <path d="M185 75 Q180 55 188 40 T182 20" stroke-dasharray="3 3"/>
  </g>

  <!-- Bone end with foil / bone knuckle -->
  <g filter="url(#softShadow)">
    <!-- Bone knob -->
    <path d="M60 170 C52 165 48 150 55 142 C62 135 75 140 82 148 L98 162 C95 168 88 175 80 178 Z" fill="url(#boneGrad)" stroke="#BCAAA4" stroke-width="1.5"/>
    <circle cx="58" cy="148" r="9" fill="url(#boneGrad)"/>
    <circle cx="53" cy="162" r="8" fill="url(#boneGrad)"/>
    
    <!-- Crispy Broast Drumstick Body -->
    <path d="M90 155 C95 130 115 95 145 80 C180 65 225 78 245 105 C260 125 255 155 235 175 C210 198 170 205 130 195 C105 188 92 172 90 155 Z" fill="url(#broastCrust)"/>
    
    <!-- Crunchy Texture flakes / crumbs -->
    <!-- Crisp clusters -->
    <path d="M135 92 C145 88 160 92 165 98 C170 105 160 112 150 110 C140 108 130 100 135 92 Z" fill="#FFE082" opacity="0.7"/>
    <path d="M180 88 C195 82 215 90 220 102 C222 110 210 118 200 114 C190 110 182 98 180 88 Z" fill="#FFCA28" opacity="0.8"/>
    <path d="M165 125 C175 118 190 122 192 132 C194 140 182 146 172 142 C162 138 158 130 165 125 Z" fill="#FFE082" opacity="0.75"/>
    <path d="M210 130 C225 125 238 135 235 148 C232 158 218 162 208 155 C200 148 202 135 210 130 Z" fill="#FFA000" opacity="0.85"/>
    <path d="M135 145 C148 140 160 150 155 162 C150 172 138 172 130 165 C122 158 126 148 135 145 Z" fill="#FF8F00" opacity="0.8"/>
    <path d="M170 160 C182 155 195 162 192 174 C189 184 176 186 168 180 C160 174 163 164 170 160 Z" fill="#E65100" opacity="0.9"/>
    
    <!-- Crunchy highlights -->
    <ellipse cx="185" cy="100" rx="35" ry="16" fill="url(#broastHighlight)" transform="rotate(-15 185 100)"/>

    <!-- Red Masala Spices Speckles -->
    <circle cx="130" cy="115" r="1.5" fill="#D50000"/>
    <circle cx="152" cy="102" r="2" fill="#B71C1C"/>
    <circle cx="175" cy="115" r="1.8" fill="#FF1744"/>
    <circle cx="198" cy="105" r="1.5" fill="#D50000"/>
    <circle cx="215" cy="120" r="2.2" fill="#B71C1C"/>
    <circle cx="188" cy="140" r="1.7" fill="#FF1744"/>
    <circle cx="160" cy="150" r="2" fill="#D50000"/>
    <circle cx="140" cy="170" r="1.5" fill="#B71C1C"/>
    <circle cx="178" cy="172" r="2.2" fill="#FF5252"/>
    <circle cx="222" cy="145" r="1.8" fill="#D50000"/>

    <!-- Black Pepper specks -->
    <circle cx="142" cy="122" r="1.2" fill="#212121"/>
    <circle cx="168" cy="108" r="1.5" fill="#212121"/>
    <circle cx="192" cy="128" r="1.3" fill="#212121"/>
    <circle cx="205" cy="140" r="1.4" fill="#212121"/>
    <circle cx="155" cy="165" r="1.2" fill="#212121"/>
  </g>

  <!-- Lemon wedge at bottom right -->
  <g transform="translate(210, 168)">
    <path d="M0 25 A25 25 0 0 1 40 5 L0 25 Z" fill="#FFEE58" stroke="#FDD835" stroke-width="2"/>
    <path d="M5 23 A20 20 0 0 1 36 8 L5 23 Z" fill="#FFF59D"/>
    <!-- Segments -->
    <path d="M12 21 L28 12" stroke="#FFF" stroke-width="1.2"/>
    <path d="M18 22 L32 17" stroke="#FFF" stroke-width="1.2"/>
  </g>

  <!-- Spicy Garlic Sauce Dip Cup on bottom left -->
  <g transform="translate(70, 165)">
    <ellipse cx="25" cy="30" rx="22" ry="7" fill="#424242"/>
    <path d="M5 28 L9 42 C10 46 40 46 41 42 L45 28 Z" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
    <ellipse cx="25" cy="28" rx="20" ry="6" fill="url(#sauceGrad)"/>
    <ellipse cx="23" cy="27" rx="14" ry="3.5" fill="#FF5252" opacity="0.6"/>
    <!-- Garlic Mayo Swirl -->
    <path d="M17 28 Q25 25 31 28" stroke="#FFF9C4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
