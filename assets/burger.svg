<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="burgerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9E00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="70%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="bottomBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="crispyFillet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="50%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#4E0D00"/>
    </linearGradient>
    <linearGradient id="cheeseMelt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="burgerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="150" cy="130" r="110" fill="url(#burgerGlow)"/>
  <ellipse cx="150" cy="235" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#burgerShadow)">
    <!-- Bottom Bun -->
    <path d="M70 200 C70 190 85 185 150 185 C215 185 230 190 230 200 C230 216 215 228 150 228 C85 228 70 216 70 200 Z" fill="url(#bottomBun)"/>

    <!-- Special Spicy Sauce / Mayo Drips -->
    <path d="M85 186 C95 186 100 196 110 196 C120 196 125 186 135 186 C145 186 150 198 162 198 C174 198 178 186 190 186 C202 186 210 195 218 186 Z" fill="#FFE082"/>

    <!-- Melted Cheddar Cheese Layer dripping -->
    <polygon points="65,168 235,168 230,178 205,178 195,195 182,178 140,178 128,198 116,178 72,178" fill="url(#cheeseMelt)"/>
    
    <!-- Crispy Zinger Chicken Fillet -->
    <path d="M55 150 C55 142 80 135 150 136 C220 135 245 142 245 152 C248 165 235 178 190 176 C140 174 110 180 80 174 C60 170 55 160 55 150 Z" fill="url(#crispyFillet)"/>
    <!-- Crispy flakes & crunch ridges on fillet -->
    <path d="M70 148 Q85 138 95 150 Q110 140 125 152 Q145 138 165 150 Q190 140 215 152 Q230 142 240 152" stroke="#FFD54F" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="158" r="2" fill="#D50000"/>
    <circle cx="120" cy="162" r="2" fill="#FF1744"/>
    <circle cx="165" cy="165" r="2" fill="#D50000"/>
    <circle cx="210" cy="160" r="2" fill="#FF1744"/>

    <!-- Ruffled Crispy Green Lettuce leaves -->
    <path d="M60 135 C65 125 80 128 92 135 C102 124 118 126 130 136 C142 125 158 125 170 136 C182 126 198 124 208 135 C220 126 235 128 240 136 C235 145 220 148 208 144 C195 148 180 145 170 142 C158 148 142 146 130 142 C118 148 102 145 92 142 C80 146 65 142 60 135 Z" fill="#43A047"/>
    <path d="M65 134 C75 128 88 132 95 137 C108 129 122 131 132 138 C145 129 160 129 172 138 C185 130 198 128 208 137 C218 130 228 133 235 138" stroke="#81C784" stroke-width="2.5" fill="none"/>

    <!-- Juicy Tomato Slice -->
    <rect x="75" y="120" width="150" height="12" rx="6" fill="#D32F2F"/>
    <rect x="85" y="122" width="60" height="5" rx="2.5" fill="#EF5350"/>
    <rect x="155" y="122" width="60" height="5" rx="2.5" fill="#EF5350"/>

    <!-- Top Brioche Bun -->
    <path d="M68 118 C65 65 105 38 150 38 C195 38 235 65 232 118 C232 124 220 126 150 126 C80 126 68 124 68 118 Z" fill="url(#topBun)"/>
    <ellipse cx="150" cy="52" rx="55" ry="16" fill="#FFCC80" opacity="0.35"/>

    <!-- Golden White Sesame Seeds -->
    <g fill="#FFF9C4" opacity="0.95">
      <ellipse cx="105" cy="62" rx="3.5" ry="2" transform="rotate(-25 105 62)"/>
      <ellipse cx="130" cy="50" rx="3.5" ry="2" transform="rotate(10 130 50)"/>
      <ellipse cx="155" cy="54" rx="3.5" ry="2" transform="rotate(-15 155 54)"/>
      <ellipse cx="180" cy="58" rx="3.5" ry="2" transform="rotate(30 180 58)"/>
      <ellipse cx="120" cy="74" rx="3.5" ry="2" transform="rotate(-40 120 74)"/>
      <ellipse cx="145" cy="70" rx="3.5" ry="2" transform="rotate(15 145 70)"/>
      <ellipse cx="170" cy="76" rx="3.5" ry="2" transform="rotate(-20 170 76)"/>
      <ellipse cx="195" cy="74" rx="3.5" ry="2" transform="rotate(25 195 74)"/>
      <ellipse cx="90" cy="85" rx="3.5" ry="2" transform="rotate(-15 90 85)"/>
      <ellipse cx="135" cy="92" rx="3.5" ry="2" transform="rotate(5 135 92)"/>
      <ellipse cx="162" cy="94" rx="3.5" ry="2" transform="rotate(-30 162 94)"/>
      <ellipse cx="205" cy="92" rx="3.5" ry="2" transform="rotate(40 205 92)"/>
      <ellipse cx="110" cy="105" rx="3.5" ry="2" transform="rotate(-10 110 105)"/>
      <ellipse cx="180" cy="106" rx="3.5" ry="2" transform="rotate(20 180 106)"/>
    </g>
  </g>
</svg>
