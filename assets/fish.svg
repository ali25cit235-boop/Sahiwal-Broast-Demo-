<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="fishGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fishCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="40%" stop-color="#E65100"/>
      <stop offset="80%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#4E0D00"/>
    </linearGradient>
    <filter id="fishShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="120" r="105" fill="url(#fishGlow)"/>
  <ellipse cx="150" cy="210" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#fishShadow)">
    <!-- Serving Platter -->
    <ellipse cx="150" cy="135" rx="112" ry="46" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    <ellipse cx="150" cy="133" rx="102" ry="40" fill="#FFFFFF"/>

    <!-- Red Onion Rings Bed -->
    <ellipse cx="90" cy="150" rx="18" ry="7" fill="none" stroke="#E91E63" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="205" cy="152" rx="16" ry="6" fill="none" stroke="#E91E63" stroke-width="2" opacity="0.7"/>
    <ellipse cx="150" cy="162" rx="20" ry="7" fill="none" stroke="#E91E63" stroke-width="2" opacity="0.6"/>

    <!-- Whole Fried Rohu Fish (رہو فش فرائی) -->
    <!-- Tail Fin -->
    <polygon points="50,118 30,105 32,135" fill="url(#fishCrust)"/>
    <!-- Dorsal Fin -->
    <path d="M110 102 C125 90 160 92 180 100 Z" fill="url(#fishCrust)"/>
    <!-- Fish Body -->
    <path d="M50 120 C70 95 180 92 235 115 C245 120 248 126 235 132 C180 152 70 148 50 120 Z" fill="url(#fishCrust)"/>

    <!-- Head & Eye -->
    <circle cx="218" cy="116" r="3.5" fill="#212121"/>
    <circle cx="219" cy="115" r="1.2" fill="#FFFFFF"/>
    <!-- Gill slit -->
    <path d="M198 108 C204 118 202 128 196 132" stroke="#3E2723" stroke-width="2" fill="none"/>

    <!-- Diagonal Deep Cuts (Tawa Fried / Grilled Slits) -->
    <line x1="85" y1="108" x2="98" y2="132" stroke="#3E2723" stroke-width="2.5"/>
    <line x1="110" y1="106" x2="124" y2="134" stroke="#3E2723" stroke-width="2.5"/>
    <line x1="135" y1="106" x2="150" y2="136" stroke="#3E2723" stroke-width="2.5"/>
    <line x1="162" y1="108" x2="175" y2="134" stroke="#3E2723" stroke-width="2.5"/>

    <!-- Golden crispy skin blisters -->
    <ellipse cx="102" cy="118" rx="6" ry="3" fill="#FFE082" opacity="0.8"/>
    <ellipse cx="128" cy="116" rx="7" ry="3.5" fill="#FFE082" opacity="0.8"/>
    <ellipse cx="155" cy="120" rx="8" ry="4" fill="#FFE082" opacity="0.8"/>
    <ellipse cx="180" cy="122" rx="5" ry="3" fill="#FFE082" opacity="0.8"/>

    <!-- Chaat Masala and Red Chili flakes -->
    <circle cx="95" cy="120" r="1.5" fill="#D50000"/>
    <circle cx="120" cy="122" r="1.8" fill="#B71C1C"/>
    <circle cx="145" cy="118" r="2" fill="#D50000"/>
    <circle cx="170" cy="125" r="1.7" fill="#B71C1C"/>

    <!-- Fresh Lemon Slices on Fish -->
    <circle cx="128" cy="132" r="11" fill="#FFEE58" stroke="#FBC02D" stroke-width="1.8"/>
    <circle cx="128" cy="132" r="8" fill="#FFF59D"/>
    <circle cx="162" cy="130" r="11" fill="#FFEE58" stroke="#FBC02D" stroke-width="1.8"/>
    <circle cx="162" cy="130" r="8" fill="#FFF59D"/>
  </g>
</svg>
