<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="friesGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fryBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="fryGolden" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="friesShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="125" r="105" fill="url(#friesGlow)"/>
  <ellipse cx="150" cy="225" rx="85" ry="12" fill="#050304" opacity="0.6"/>

  <g filter="url(#friesShadow)">
    <!-- Back Fries Layer -->
    <rect x="85" y="45" width="14" height="95" rx="3" fill="url(#fryGolden)" transform="rotate(-18 92 90)"/>
    <rect x="110" y="35" width="14" height="105" rx="3" fill="url(#fryGolden)" transform="rotate(-8 117 87)"/>
    <rect x="135" y="28" width="14" height="110" rx="3" fill="url(#fryGolden)" transform="rotate(-2 142 83)"/>
    <rect x="160" y="32" width="14" height="105" rx="3" fill="url(#fryGolden)" transform="rotate(7 167 84)"/>
    <rect x="185" y="42" width="14" height="100" rx="3" fill="url(#fryGolden)" transform="rotate(16 192 92)"/>
    <rect x="205" y="55" width="14" height="85" rx="3" fill="url(#fryGolden)" transform="rotate(25 212 97)"/>

    <!-- Front Fries Layer -->
    <rect x="100" y="55" width="13" height="95" rx="3" fill="#FFD54F" transform="rotate(-12 106 102)"/>
    <rect x="122" y="45" width="13" height="105" rx="3" fill="#FFE082" transform="rotate(-5 128 97)"/>
    <rect x="148" y="42" width="13" height="108" rx="3" fill="#FFCA28" transform="rotate(4 154 96)"/>
    <rect x="172" y="50" width="13" height="100" rx="3" fill="#FFD54F" transform="rotate(12 178 100)"/>

    <!-- Masala Seasoning Dust -->
    <circle cx="102" cy="70" r="1.5" fill="#D50000"/>
    <circle cx="125" cy="55" r="1.8" fill="#FF1744"/>
    <circle cx="150" cy="50" r="2" fill="#D50000"/>
    <circle cx="170" cy="65" r="1.5" fill="#B71C1C"/>
    <circle cx="190" cy="75" r="1.6" fill="#D50000"/>
    <circle cx="138" cy="80" r="1.5" fill="#212121"/>
    <circle cx="160" cy="78" r="1.5" fill="#212121"/>

    <!-- Fries Box / Carton -->
    <path d="M80 120 L96 215 C98 220 202 220 204 215 L220 120 C185 140 115 140 80 120 Z" fill="url(#fryBox)"/>
    <!-- Yellow Accent Arch on Box -->
    <path d="M120 155 C120 135 180 135 180 155 C180 185 120 185 120 155 Z" fill="#FFCA28" opacity="0.9"/>
    <path d="M130 155 C130 142 170 142 170 155 C170 178 130 178 130 155 Z" fill="#E53935"/>
    <text x="150" y="166" fill="#FFD54F" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="20" font-weight="900" text-anchor="middle">SB</text>
  </g>
</svg>
