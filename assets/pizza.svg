<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="pizzaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
    <filter id="pizzaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="120" r="105" fill="url(#pizzaGlow)"/>
  <ellipse cx="150" cy="210" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#pizzaShadow)">
    <!-- Pizza Pan Base -->
    <ellipse cx="150" cy="135" rx="104" ry="46" fill="#37474F"/>
    
    <!-- Golden Puffy Crust (Kabab Crust / Stuffed Crust) -->
    <ellipse cx="150" cy="132" rx="98" ry="42" fill="url(#crustGrad)"/>
    
    <!-- Melted Mozzarella & Cheddar Cheese Wheel -->
    <ellipse cx="150" cy="130" rx="85" ry="34" fill="url(#cheeseGrad)"/>
    <!-- Red Spicy Pizza Sauce swirl peeking -->
    <ellipse cx="150" cy="128" rx="72" ry="26" fill="#D32F2F" opacity="0.25"/>

    <!-- Chicken Malai Boti & Tikka Toppings -->
    <rect x="110" y="115" width="16" height="12" rx="4" fill="#FFE082" stroke="#FF9800" stroke-width="1"/>
    <rect x="135" y="105" width="18" height="14" rx="4" fill="#C62828" stroke="#B71C1C" stroke-width="1"/>
    <rect x="165" y="112" width="16" height="12" rx="4" fill="#FFE082" stroke="#FF9800" stroke-width="1"/>
    <rect x="125" y="130" width="18" height="13" rx="4" fill="#D32F2F" stroke="#B71C1C" stroke-width="1"/>
    <rect x="155" y="132" width="16" height="12" rx="4" fill="#FFE082" stroke="#FF9800" stroke-width="1"/>
    <rect x="180" y="125" width="17" height="12" rx="4" fill="#C62828" stroke="#B71C1C" stroke-width="1"/>

    <!-- Green Capsicum slices (شملہ مرچ) -->
    <path d="M102 128 Q112 124 116 132" stroke="#43A047" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M145 120 Q152 116 156 124" stroke="#43A047" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M172 138 Q180 134 184 142" stroke="#43A047" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Black Olives Rings -->
    <ellipse cx="120" cy="122" rx="4.5" ry="3" fill="#212121"/>
    <ellipse cx="120" cy="122" rx="2" ry="1.5" fill="#FFEE58"/>
    <ellipse cx="148" cy="138" rx="4.5" ry="3" fill="#212121"/>
    <ellipse cx="148" cy="138" rx="2" ry="1.5" fill="#FFEE58"/>
    <ellipse cx="170" cy="118" rx="4.5" ry="3" fill="#212121"/>
    <ellipse cx="170" cy="118" rx="2" ry="1.5" fill="#FFEE58"/>

    <!-- Oregano / Chili Flakes herbs dusting -->
    <circle cx="130" cy="115" r="1.2" fill="#2E7D32"/>
    <circle cx="142" cy="125" r="1.5" fill="#D50000"/>
    <circle cx="160" cy="115" r="1.2" fill="#2E7D32"/>
    <circle cx="135" cy="140" r="1.5" fill="#D50000"/>
  </g>
</svg>
