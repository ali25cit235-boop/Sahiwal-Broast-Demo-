<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="shawarmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFA000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
    <linearGradient id="wrapPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <filter id="shawarmaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="120" r="105" fill="url(#shawarmaGlow)"/>
  <ellipse cx="150" cy="210" rx="90" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#shawarmaShadow)">
    <!-- Slanted Shawarma Roll / Paratha Roll Body -->
    <!-- Bread / Pita wrap -->
    <path d="M85 160 C80 130 110 60 170 40 C200 30 220 50 215 80 L140 200 C125 210 95 195 85 160 Z" fill="url(#pitaGrad)"/>
    <!-- Toasted griddle marks on pita -->
    <ellipse cx="140" cy="80" rx="14" ry="4" fill="#8D6E63" opacity="0.7" transform="rotate(-35 140 80)"/>
    <ellipse cx="120" cy="120" rx="16" ry="4" fill="#8D6E63" opacity="0.7" transform="rotate(-35 120 120)"/>
    <ellipse cx="165" cy="110" rx="12" ry="4" fill="#8D6E63" opacity="0.7" transform="rotate(-35 165 110)"/>

    <!-- Bottom branded paper wrapper -->
    <path d="M90 150 L140 205 C150 205 160 195 165 185 L125 130 C105 135 95 142 90 150 Z" fill="url(#wrapPaper)"/>
    <!-- Wrapper label stripe -->
    <path d="M100 146 L134 195" stroke="#E53935" stroke-width="6"/>

    <!-- Open Top Filling Burst (Juicy Spiced Chicken & Veggies) -->
    <ellipse cx="185" cy="55" rx="36" ry="24" fill="#D84315" transform="rotate(-30 185 55)"/>
    <!-- Garlic Mayo & Tahini Sauce Drizzle -->
    <path d="M165 45 Q180 60 195 42 Q205 55 210 65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Crisp Pickled Cucumber & Tomato chunks -->
    <rect x="168" y="40" width="14" height="8" rx="3" fill="#43A047" transform="rotate(-20 175 44)"/>
    <rect x="190" y="52" width="12" height="8" rx="3" fill="#E53935" transform="rotate(-15 196 56)"/>
    <rect x="180" y="60" width="15" height="7" rx="3" fill="#43A047" transform="rotate(25 187 63)"/>

    <!-- Crispy Spiced Shredded Chicken -->
    <circle cx="175" cy="52" r="4" fill="#BF360C"/>
    <circle cx="198" cy="45" r="4.5" fill="#BF360C"/>
    <circle cx="205" cy="58" r="3.5" fill="#FF5722"/>
  </g>
</svg>
