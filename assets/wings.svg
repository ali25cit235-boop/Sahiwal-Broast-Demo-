<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="wingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B71C1C"/>
      <stop offset="40%" stop-color="#E53935"/>
      <stop offset="80%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#7F0000"/>
    </linearGradient>
    <linearGradient id="wingCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="60%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#4E0D00"/>
    </linearGradient>
    <filter id="wingsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="125" r="105" fill="url(#wingGlow)"/>
  <ellipse cx="150" cy="230" rx="95" ry="14" fill="#050304" opacity="0.6"/>

  <g filter="url(#wingsShadow)">
    <!-- Wings in background of bucket -->
    <!-- Left Wing -->
    <path d="M75 110 C60 90 70 65 95 60 C115 55 130 80 120 110 Z" fill="url(#wingCrust)" transform="rotate(-20 95 85)"/>
    <!-- Center Wing -->
    <path d="M130 100 C120 70 135 45 160 45 C185 45 195 75 180 105 Z" fill="url(#wingCrust)"/>
    <!-- Right Wing -->
    <path d="M190 110 C185 75 210 55 230 65 C245 75 250 100 230 115 Z" fill="url(#wingCrust)" transform="rotate(15 215 85)"/>
    <!-- Nuggets spilling -->
    <rect x="100" y="90" width="35" height="24" rx="10" fill="#FFA000" transform="rotate(-12 117 102)"/>
    <rect x="165" y="88" width="38" height="25" rx="11" fill="#FF8F00" transform="rotate(18 184 100)"/>
    <rect x="135" y="80" width="36" height="25" rx="10" fill="#FFB300" transform="rotate(5 153 92)"/>

    <!-- Masala and flakes on wings -->
    <circle cx="95" cy="72" r="1.8" fill="#FF1744"/>
    <circle cx="155" cy="62" r="2" fill="#D50000"/>
    <circle cx="215" cy="78" r="1.8" fill="#FF1744"/>
    <circle cx="120" cy="98" r="1.5" fill="#212121"/>
    <circle cx="178" cy="95" r="1.5" fill="#212121"/>

    <!-- Bucket Body -->
    <path d="M68 115 L88 215 C90 222 210 222 212 215 L232 115 Z" fill="url(#bucketGrad)"/>
    
    <!-- Bucket Rim -->
    <ellipse cx="150" cy="115" rx="82" ry="14" fill="#FFCA28"/>
    <ellipse cx="150" cy="115" rx="77" ry="11" fill="#FF8F00"/>

    <!-- Bucket Graphics / Branding Stripe -->
    <path d="M76 150 L82 180 C110 188 190 188 218 180 L224 150 C195 158 105 158 76 150 Z" fill="#FFF8E7"/>
    
    <!-- Text / Emblem in bucket stripe -->
    <text x="150" y="172" fill="#B71C1C" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">HOT WINGS</text>

    <!-- Bucket Bottom Rim -->
    <ellipse cx="150" cy="216" rx="62" ry="7" fill="#880E4F" opacity="0.5"/>
  </g>
</svg>
